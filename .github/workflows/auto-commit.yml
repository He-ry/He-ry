name: Auto Commit

on:
  schedule:
    # UTC 时间，每天执行一次
    # 中国时间 = UTC + 8
    - cron: '23 2 * * *'    # 中国时间 10:23
  workflow_dispatch:         # 允许手动触发测试

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auto commit
        run: |
          # --- 随机决定今天是否提交 ---
          # 0 = 今天不提交
          # 1 = 今天提交一次
          SHOULD_COMMIT=$((RANDOM % 2))

          echo "Today's random result: $SHOULD_COMMIT"

          if [ "$SHOULD_COMMIT" -eq 0 ]; then
            echo "今天随机结果为 0，不提交。"
            exit 0
          fi

          # --- 配置 git 身份 ---
          git config user.name "He-ry"
          git config user.email "He-ry@users.noreply.github.com"

          # --- 追加一条记录到 log 文件 ---
          mkdir -p log
          FILE="log/$(date -u +%Y-%m-%d).md"

          if [ ! -f "$FILE" ]; then
            echo "# $(date -u +%Y-%m-%d)" > "$FILE"
            echo "" >> "$FILE"
          fi

          echo "- $(date -u +%H:%M:%S) — keep going." >> "$FILE"

          # --- 提交 ---
          git add "$FILE"
          git commit -m "log: $(date -u +%Y-%m-%d) $(date -u +%H:%M)"

      - name: Push
        run: git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
